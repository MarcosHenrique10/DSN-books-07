    <p>
      <span class="font-5">
        <span id="w913">&#8220;Look,</span>
        <span id="w914">Mowgli,&#8221;</span>
        <span id="w915">Baloo</span>
        <span id="w916">said</span>
        <span id="w917">when</span>
        <span id="w918">they</span>
        <span id="w919">were</span>
        <span id="w920">safe.</span>
        <br/>
        <span id="w921">&#8220;I</span>
        <span id="w922">got</span>
        <span id="w923">to</span>
        <span id="w924">take</span>
        <span id="w925">you</span>
        <span id="w926">back</span>
        <span id="w927">to</span>
        <span id="w928">the</span>
        <span id="w929">Man-village.&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w931">&#8220;But</span>
        <span id="w932">you</span>
        <span id="w933">said</span>
        <span id="w934">we</span>
        <span id="w935">were</span>
        <span id="w936">partners,&#8221;</span>
        <span id="w937">Mowgli</span>
        <span id="w938">said.</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w939">Baloo</span>
        <span id="w940">tried</span>
        <span id="w941">to</span>
        <span id="w942">explain,</span>
        <span id="w943">but</span>
        <span id="w944">Mowgli</span>
        <span id="w945">would</span>
        <span id="w946">not</span>
        <span id="w947">listen.</span>
        <br/>
        <span id="w948">Angry,</span>
        <span id="w949">he</span>
        <span id="w950">ran</span>
        <span id="w951">away.</span>
        <span id="w952">And</span>
        <span id="w953">that</span>
        <span id="w954">was</span>
        <span id="w955">when</span>
        <span id="w956">Shere Khan</span>
        <span id="w958">found</span>
        <br/>
        <span id="w959">him</span>
        <span id="w960">at</span>
        <span id="w961">last.</span>
      </span>
    </p>
