      <span class="font-5">
        <span id="w478">At</span>
        <span id="w479">that</span>
        <span id="w480">moment,</span>
        <span id="w481">Bagheera</span>
        <span id="w482">appeared.</span>
        <span id="w483">He</span>
        <span id="w484">had</span>
        <span id="w485">been</span>
        <br/>
        <span id="w486">searching</span>
        <span id="w487">for</span>
        <span id="w488">Mowgli</span>
        <span id="w489">all</span>
        <span id="w490">day.</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w491">&#8220;I</span>
        <span id="w492">can</span>
        <span id="w493">explain,&#8221;</span>
        <span id="w494">the</span>
        <span id="w495">panther</span>
        <span id="w496">told</span>
        <span id="w497">Colonel</span>
        <span id="w498">Hathi.</span>
        <br/>
        <span id="w499">&#8220;The</span>
        <span id="w500">Man-cub</span>
        <span id="w502">is</span>
        <span id="w503">with</span>
        <span id="w504">me.</span>
        <span id="w505">I&#8217;m</span>
        <span id="w506">taking</span>
        <span id="w507">him</span>
        <span id="w508">back</span>
        <span id="w509">to</span>
        <span id="w510">the</span>
        <br/>
        <span id="w511">Man-village.&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w513">Colonel</span>
        <span id="w514">Hathi</span>
        <span id="w515">nodded.</span>
        <span id="w516">&#8220;Very</span>
        <span id="w517">well.</span>
        <span id="w518">Carry</span>
        <span id="w519">on,&#8221;</span>
        <span id="w520">he</span>
        <span id="w521">said.</span>
