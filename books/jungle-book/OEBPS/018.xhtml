    <p>
      <span class="font-5">
        <span id="w522">Mowgli</span>
        <span id="w523">and</span>
        <span id="w524">Bagheera</span>
        <span id="w525">had</span>
        <span id="w526">not</span>
        <span id="w527">gone</span>
        <span id="w528">far</span>
        <span id="w529">when</span>
        <span id="w530">the</span>
        <br/>
        <span id="w531">Man-cub</span>
        <span id="w533">asked,</span>
        <span id="w534">&#8220;Bagheera,</span>
        <span id="w535">where</span>
        <span id="w536">are</span>
        <span id="w537">we</span>
        <span id="w538">going?&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w539">&#8220;You&#8217;re</span>
        <span id="w540">going</span>
        <span id="w541">back</span>
        <span id="w542">to</span>
        <span id="w543">the</span>
        <span id="w544">Man-village</span>
        <span id="w546">right</span>
        <span id="w547">now!&#8221;</span>
        <span id="w548">the</span>
        <br/>
        <span id="w549">panther</span>
        <span id="w550">answered.</span>
      </span>
    </p>
    <p>
      <span class="font-5">
        <span id="w551">But</span>
        <span id="w552">Mowgli</span>
        <span id="w553">still</span>
        <span id="w554">did</span>
        <span id="w555">not</span>
        <span id="w556">want</span>
        <span id="w557">to</span>
        <span id="w558">leave</span>
        <span id="w559">the</span>
        <span id="w560">jungle.</span>
        <span id="w561">&#8220;I&#8217;m</span>
        <br/>
        <span id="w562">staying</span>
        <span id="w563">right</span>
        <span id="w564">here,&#8221;</span>
        <span id="w565">he</span>
        <span id="w566">said,</span>
        <span id="w567">grabbing</span>
        <span id="w568">hold</span>
        <span id="w569">of</span>
        <span id="w570">a</span>
        <span id="w571">small</span>
        <span id="w572">tree.</span>
      </span>
    </p>
