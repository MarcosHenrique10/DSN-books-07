  <div class="page">
  <img src="images/025.jpg" alt="" />  <div class="text-frame" style="left:123px; top:93px; width:551px; height:237px;">    <p>      <span class="font-3">        <span id="w1368">Suddenly</span>        <span id="w1369">a</span>        <span id="w1370">taxi</span>        <span id="w1371">drove</span>        <span id="w1372">up</span>        <span id="w1373">with</span>        <span id="w1374">Lady</span>        <span id="w1375">and</span>        <span id="w1376">Jim</span>        <span id="w1377">Dear</span>        <span id="w1378">in</span>        <span id="w1379">it.</span>        <br/>        <span id="w1380">Lady</span>        <span id="w1381">jumped</span>        <span id="w1382">out</span>        <span id="w1383">and</span>        <span id="w1384">raced</span>        <span id="w1385">over</span>        <span id="w1386">to</span>        <span id="w1387">the</span>        <span id="w1388">wagon.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w1389">&#8220;Tramp,</span>        <span id="w1390">are</span>        <span id="w1391">you</span>        <span id="w1392">all</span>        <span id="w1393">right?&#8221;</span>        <span id="w1394">she</span>        <span id="w1395">called</span>        <span id="w1396">through</span>        <span id="w1397">the</span>        <br/>        <span id="w1398">netting.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w1399">Tramp</span>        <span id="w1400">was</span>        <span id="w1401">safe,</span>        <span id="w1402">but</span>        <span id="w1403">Trusty</span>        <span id="w1404">had</span>        <span id="w1405">been</span>        <span id="w1406">crushed</span>        <span id="w1407">by</span>        <span id="w1408">the</span>        <br/>        <span id="w1409">wheel.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w1410">&#8220;He</span>        <span id="w1411">needs</span>        <span id="w1412">a</span>        <span id="w1413">doctor,&#8221;</span>        <span id="w1414">said</span>        <span id="w1415">Jock.</span>        <span id="w1416">And</span>        <span id="w1417">they</span>        <span id="w1418">took</span>        <span id="w1419">Trusty</span>        <span id="w1420">to</span>        <br/>        <span id="w1421">the</span>        <span id="w1422">hospital.</span>      </span>    </p>  </div><span id="empty"></span></div>
