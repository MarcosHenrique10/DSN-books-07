  <img src="images/015.jpg" alt="" />  <div class="text-frame" style="left:123px; top:634px; width:551px; height:204px;">    <p>      <span class="font-3">        <span id="w719">As</span>        <span id="w720">they</span>        <span id="w721">approached</span>        <span id="w722">Lady&#8217;s</span>        <span id="w723">home,</span>        <span id="w724">Tramp</span>        <span id="w725">spotted</span>        <span id="w726">a</span>        <br/>        <span id="w727">henhouse.</span>        <span id="w728">&#8220;Follow</span>        <span id="w729">me,&#8221;</span>        <span id="w730">he</span>        <span id="w731">shouted.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w732">Tramp</span>        <span id="w733">began</span>        <span id="w734">chasing</span>        <span id="w735">the</span>        <span id="w736">chickens</span>        <span id="w737">around</span>        <span id="w738">the</span>        <br/>        <span id="w739">farmyard.</span>        <span id="w740">Feathers</span>        <span id="w741">flew</span>        <span id="w742">everywhere!</span>        <span id="w743">Suddenly,</span>        <span id="w744">there</span>        <span id="w745">was</span>        <br/>        <span id="w746">a</span>        <span id="w747">loud</span>        <span id="w748">bang.</span>      </span>    </p>    <p>      <span class="font-3">        <span id="w749">&#8220;Come</span>        <span id="w750">on!&#8221;</span>        <span id="w751">shouted</span>        <span id="w752">Tramp</span>        <span id="w753">as</span>        <span id="w754">he</span>        <span id="w755">squeezed</span>        <span id="w756">under</span>        <span id="w757">a</span>        <br/>        <span id="w758">fence.</span>        <span id="w759">&#8220;That&#8217;s</span>        <span id="w760">the</span>        <span id="w761">signal</span>        <span id="w762">to</span>        <span id="w763">get</span>        <span id="w764">going!&#8221;</span>      </span>    </p>  </div><span id="empty"></span></div>
